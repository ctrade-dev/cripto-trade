x-application-env-example:
  BINANCE_API_KEY: "your-binance-api-key"
  BINANCE_API_SECRET: "your-binance-api-secret"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ctrade-postgres
    restart: unless-stopped
    profiles: [base]
    environment:
      POSTGRES_DB: ctrade
      POSTGRES_USER: ctrade
      POSTGRES_PASSWORD: ctrade123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctrade -d ctrade"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: ctrade-prometheus
    restart: unless-stopped
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  loki:
    image: grafana/loki:3.4.2
    container_name: ctrade-loki
    restart: unless-stopped
    profiles: [observability]
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ctrade-app:
    build: .
    container_name: ctrade-app
    restart: unless-stopped
    profiles: [app]
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # Compose só injeta variáveis explicitamente listadas; sem isto o adapter Discord
      # ficaria em no-op dentro do container mesmo com DISCORD_WEBHOOK_URL setado no host.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      GRAFANA_EXPLORE_URL_TEMPLATE: ${GRAFANA_EXPLORE_URL_TEMPLATE:-}
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: ctrade-grafana
    restart: unless-stopped
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ctrade123
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Usado pelo contact point Discord provisionado (docker/grafana/provisioning/alerting).
      # Sem a env var os alertas comportamentais disparam mas não entregam no Discord.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
