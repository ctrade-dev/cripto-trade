# Loki de uma instancia, armazenamento em disco (volume loki_data).
#
# T66: mesma configuracao padrao da imagem grafana/loki:2.9.0 (a do compose local: boltdb-shipper,
# schema v11), so com a telemetria desligada. A versao anterior (indice TSDB + compactor com retencao)
# perdia os logs que saiam da memoria do ingester: na rodada 7 da T53 os chunks ficaram no disco, mas
# o indice nao os achava, e as consultas so viam as ultimas ~2h.
#
# Sem retencao automatica: com o nivel DEBUG o volume de uma rodada de 72h e pequeno perto dos ~37 GB
# livres. Limpar entre rodadas, se precisar: docker compose down loki && docker volume rm ctrade-vps_loki_data.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false
