global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ctrade'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Na VPS o ctrade roda no mesmo compose; alcancado pelo nome do servico na rede interna.
      # T74: staging contínuo e soak sob demanda, separados pelo rotulo env (alertas filtram env!="soak").
      - targets: ['ctrade-app:8080']
        labels:
          env: staging
      - targets: ['ctrade-soak:8080']
        labels:
          env: soak
    relabel_configs:
      - target_label: application
        replacement: ctrade
