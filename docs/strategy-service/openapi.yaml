openapi: 3.0.3

# =============================================================================
# Strategy Service Contract (v1)
#
# Contrato neutro de linguagem para estrategias executadas fora do processo do
# ctrade. Cada versao de estrategia sobe como uma app independente (Java, Node,
# Python, ...) que implementa este contrato. O ctrade e o cliente; a app da
# estrategia e o servidor.
#
# ESTE ARQUIVO E A FONTE DE VERDADE. Java, Node e Python geram/validam seus
# stubs a partir daqui. As DTOs Java em core/dto/strategy sao o espelho interno
# deste contrato — se divergirem, este spec e o CONTRACT.md prevalecem para a
# fronteira de rede.
#
# Regras de convencao (ver CONTRACT.md, secao "Convencoes"):
#   1. TODO valor decimal/monetario trafega como STRING, nunca como number JSON.
#   2. Timestamps sao ISO-8601 em UTC (string date-time).
#   3. UUIDs sao strings no formato uuid.
# =============================================================================

info:
  title: CTrade Strategy Service Contract
  version: 1.1.0
  description: >
    Superficie de rede de uma app de estrategia. Uma decisao pura por tick:
    dado market data (input) e contexto operacional consolidado (context),
    a app devolve uma decisao de trade. Sem I/O externo, sem efeito colateral
    alem do warm-up de estado interno chaveado por (strategyRef, runnerId).
    1.1 (T40): tickId/sequence com deduplicacao, sem retry do ctrade, idade
    maxima da decisao validada pelo ctrade, PnL do contexto marcado a mercado.

# Token de servico opcional: `{}` permite chamada sem credencial; com token, Bearer.
security:
  - {}
  - bearerAuth: []

servers:
  - url: http://{host}:{port}/v1
    variables:
      host: { default: localhost }
      port: { default: "8080" }

paths:
  /evaluate:
    post:
      operationId: evaluate
      summary: Avalia um tick e retorna a decisao de trade
      description: >
        Chamado pelo ctrade a cada price update do runner. A resposta DEVE ser
        sempre uma decisao valida. Falha de transporte, timeout ou erro 5xx sao
        tratados pelo ctrade como HOLD implicito (ver CONTRACT.md); ainda assim
        a app deve preferir devolver HOLD explicito a estourar erro. O ctrade
        NAO faz retry desta chamada; a mesma tickId deve devolver a mesma
        decisao e sequence <= ultimo visto nao altera o warm-up.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvaluateRequest' }
      responses:
        '200':
          description: Decisao de trade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '400':
          description: Payload invalido (nao conforme ao contrato)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /health:
    get:
      operationId: health
      summary: Liveness e readiness AGREGADA da app
      description: >
        Liveness + readiness agregada: ready=true somente se TODAS as versoes
        servidas terminaram o warm-up. Serve como probe de liveness e para apps
        de versao unica. Para a decisao de promocao de UMA versao especifica use
        GET /health/{strategyRef} — la a resposta comprova, no schema, a que
        versao o `ready` se refere.
      responses:
        '200':
          description: App viva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: App viva porem nao pronta (ao menos uma versao aquecendo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /health/{strategyRef}:
    get:
      operationId: healthScoped
      summary: Readiness de UMA versao (escopada)
      description: >
        readiness da versao strategyRef. O warm-up e chaveado por strategyRef
        (ver /evaluate), entao numa app que serve V1+V2 a V1 pode estar pronta
        enquanto a V2 aquece. A resposta ecoa strategyRef (obrigatorio e nao-nulo,
        ver ScopedHealth): o portao de promocao tem prova, no schema, de que
        `ready` pertence a versao alvo — sem isso, uma resposta agregada poderia
        se passar por escopada e promover uma versao fria. O portao NAO vira o
        ponteiro do runner para strategyRef com ready=false.
      parameters:
        - name: strategyRef
          in: path
          required: true
          description: Versao alvo (== strategyId de /meta).
          schema:
            type: string
            format: uuid
        - name: runnerId
          in: query
          required: false
          description: >
            Runner cujo warm-up interessa. Informado, `ready` fala pelo estado
            (strategyRef, runnerId) e a resposta ecoa runnerId; omitido, `ready`
            so e true quando todos os runners vistos pela versao estao prontos.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Versao viva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopedHealth' }
        '404':
          description: strategyRef nao e servido por esta app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Versao viva porem aquecendo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopedHealth' }

  /meta:
    get:
      operationId: meta
      summary: Identidade das versoes de estrategia servidas por esta app
      description: >
        Usado pelo ctrade para popular/verificar o catalogo (strategy_catalog).
        strategyId e imutavel por versao — V2 tem UUID proprio, distinto da V1.

        Retorna a LISTA das versoes servidas: como uma app pode servir V1 e V2
        (o warm-up e a avaliacao sao chaveados por strategyRef), um `/meta`
        singular so reportaria uma identidade e o catalogo nao conseguiria
        descobrir/verificar a versao alvo no endpoint compartilhado. Apps de
        versao unica retornam um array de um elemento. Opcionalmente filtravel
        por strategyRef.
      parameters:
        - name: strategyRef
          in: query
          required: false
          description: >
            Filtra para uma versao especifica (== strategyId). Omitido = todas as
            versoes servidas.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Metadados de identidade das versoes servidas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Meta' }
        '404':
          description: strategyRef informado nao e servido por esta app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de servico opcional (ctrade.strategy.remote.token); rede interna.
  schemas:

    # ---- Tipos base de convencao -------------------------------------------

    Decimal:
      type: string
      description: >
        Numero decimal de precisao arbitraria transportado como string para
        preservar precisao financeira entre linguagens. NUNCA usar number JSON.
        A app DEVE (de)serializar com biblioteca decimal (BigDecimal / Python
        decimal.Decimal / decimal.js|big.js), nunca float/Number nativo.
      pattern: '^-?\d+(\.\d+)?$'
      example: "64150.75000000"

    NullableDecimal:
      # Igual a Decimal, porem aceita null. Schema dedicado (nao allOf+nullable
      # sobre Decimal) porque em OpenAPI 3.0 o `nullable` precisa acompanhar o
      # `type` — como irmao de `allOf` ele e ignorado por validadores/geradores
      # estritos, produzindo clientes que rejeitam null nos campos abaixo.
      type: string
      nullable: true
      description: >
        Numero decimal como string (ver Decimal) que tambem admite null. Usado
        nos campos opcionais de MarketInput e nos campos de Decision cujo null
        tem semantica (ex.: limitPrice null = preco de mercado do tick).
      pattern: '^-?\d+(\.\d+)?$'
      example: "64150.75000000"

    # ---- Decimais com faixa (enforced na fronteira, ver nota) --------------
    # O Decimal generico aceita negativos e valores fora de faixa. Nos campos de
    # DECISAO (saida remota nao-confiavel que vira transacao) a faixa que o
    # contrato promete e enforced por `pattern` — decimal trafega como string,
    # entao minimum/maximum (que valem para `number`) nao se aplicam. Regex sem
    # lookahead, portavel entre Java/Python/JS/RE2. Os decimais de input/context
    # seguem Decimal generico: sao dados que o ctrade envia ja validados.

    PositiveDecimal:
      type: string
      description: 'Decimal como string, estritamente positivo (> 0). Ex.: quantity.'
      pattern: '^(0*[1-9]\d*(\.\d+)?|0+\.\d*[1-9]\d*)$'
      example: "0.03118000"

    NullablePositiveDecimal:
      type: string
      nullable: true
      description: >
        Decimal positivo (> 0) como string, ou null. Ex.: limitPrice (null =
        preco de mercado do tick; se informado, deve ser positivo).
      pattern: '^(0*[1-9]\d*(\.\d+)?|0+\.\d*[1-9]\d*)$'
      example: "64150.75000000"

    UnitFractionDecimal:
      type: string
      description: 'Decimal como string em [0, 1] inclusive. Ex.: confidence.'
      pattern: '^(0(\.\d+)?|1(\.0+)?)$'
      example: "0.80"

    Symbol:
      type: string
      description: Par de trading, ex. "BTCUSDT".
      example: "BTCUSDT"

    TradingAction:
      type: string
      enum: [SHOULD_BUY, SHOULD_SELL, SHOULD_HOLD, SHOULD_CANCEL]

    TransactionStatus:
      type: string
      description: Status de uma ordem em transito visivel no contexto.
      enum: [PENDING, SUBMITTED, PARTIAL, PARTIALLY_FILLED, FILLED, CANCELED, REJECTED, EXPIRED]

    # ---- Envelope da requisicao --------------------------------------------

    EvaluateRequest:
      type: object
      required: [strategyRef, tickId, sequence, input, context]
      properties:
        strategyRef:
          type: string
          format: uuid
          description: >
            Identidade da estrategia/versao alvo (== strategyId de /meta).
            Permite uma unica app servir multiplas versoes. Com context.runnerId,
            chaveia o estado de warm-up interno.
        tickId:
          type: string
          minLength: 1
          description: >
            Identificador opaco do tick, unico por runner. A mesma tickId para o
            mesmo runner deve receber a mesma decisao (cache), sem recalcular.
        sequence:
          type: integer
          format: int64
          minimum: 0
          description: >
            Contador monotonico crescente por runner, nao contiguo (o ctrade o
            ancora no relogio em microssegundos para sobreviver a restart). So um
            sequence maior que o ultimo aceito daquele (strategyRef, runnerId)
            entra no warm-up.
        input: { $ref: '#/components/schemas/MarketInput' }
        context: { $ref: '#/components/schemas/StrategyContext' }

    # ---- Market data (espelha StrategyInputDto) ----------------------------

    MarketInput:
      type: object
      required: [symbol, currentPrice, timestamp]
      description: >
        Dados de mercado do tick. currentPrice e obrigatorio e positivo; os
        demais precos sao opcionais. A validacao semantica rica (spread, faixa
        diaria, idade do dado) e responsabilidade do ctrade — a app recebe o
        dado ja aceito.
      properties:
        symbol: { $ref: '#/components/schemas/Symbol' }
        currentPrice: { $ref: '#/components/schemas/Decimal' }
        previousPrice: { $ref: '#/components/schemas/NullableDecimal' }
        bidPrice: { $ref: '#/components/schemas/NullableDecimal' }
        askPrice: { $ref: '#/components/schemas/NullableDecimal' }
        volume: { $ref: '#/components/schemas/NullableDecimal' }
        high24h: { $ref: '#/components/schemas/NullableDecimal' }
        low24h: { $ref: '#/components/schemas/NullableDecimal' }
        timestamp:
          type: string
          format: date-time
          description: Instante do tick, ISO-8601 UTC.
        additionalData:
          type: object
          additionalProperties: true
          nullable: true
          description: Extensao livre; chaves/valores opcionais fora do contrato tipado.

    # ---- Contexto operacional (espelha StrategyContextDto) -----------------

    StrategyContext:
      type: object
      required:
        - runnerId
        - portfolioId
        - symbol
        - positionContext
        - openLots
        - pendingOrders
        - totalCapital
        - availableCapital
        - maxOperationAmount
        - minOperationAmount
        - maxOpenPositions
        - currentOpenPositions
        - realizedPnl
        - unrealizedPnl
      description: Estado operacional consolidado e read-only para a decisao.
      properties:
        runnerId: { type: string, format: uuid }
        portfolioId: { type: string, format: uuid }
        symbol: { $ref: '#/components/schemas/Symbol' }
        positionContext: { $ref: '#/components/schemas/PositionContext' }
        openLots:
          type: array
          items: { $ref: '#/components/schemas/OpenLot' }
        pendingOrders:
          type: array
          items: { $ref: '#/components/schemas/PendingOrder' }
        totalCapital:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: >
            available + reserved do portfolio, para dimensionar a ordem. Nao e
            limite: teto do runner e saldo sao aplicados pelo ctrade na reserva.
        availableCapital: { $ref: '#/components/schemas/Decimal' }
        maxOperationAmount:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: >
            Maximo que o runner pode gastar agora: o menor entre availableCapital e o espaco do runner
            no teto (maxAllocationPercent x totalCapital menos o custo do lote aberto e das BUY em voo).
            Mesma conta da reserva (T62).
        minOperationAmount: { $ref: '#/components/schemas/Decimal' }
        maxOpenPositions: { type: integer }
        currentOpenPositions: { type: integer }
        realizedPnl: { $ref: '#/components/schemas/Decimal' }
        unrealizedPnl:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: Flutuante da posicao do simbolo do runner, marcado ao preco do tick.

    PositionContext:
      type: object
      required: [symbol, quantity, averagePrice, currentPrice, unrealizedPnl, realizedPnl, openLots]
      description: Posicao agregada do simbolo. positionId ausente/zero-qty = sem posicao aberta.
      properties:
        positionId:
          type: string
          format: uuid
          nullable: true
        symbol: { $ref: '#/components/schemas/Symbol' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        averagePrice: { $ref: '#/components/schemas/Decimal' }
        currentPrice:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: Preco do tick (marcacao a mercado); "0" sem posicao aberta.
        unrealizedPnl:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: currentPrice x quantity - custo pago pelas unidades detidas.
        realizedPnl: { $ref: '#/components/schemas/Decimal' }
        openLots:
          type: array
          items: { $ref: '#/components/schemas/OpenLot' }

    OpenLot:
      type: object
      required: [lotId, quantity, availableQuantity, entryPrice, currentPnlPercent, openedAt]
      description: Lote de compra aberto. availableQuantity e o teto de SELL para este lote.
      properties:
        lotId: { type: string, format: uuid }
        quantity: { $ref: '#/components/schemas/Decimal' }
        availableQuantity: { $ref: '#/components/schemas/Decimal' }
        entryPrice: { $ref: '#/components/schemas/Decimal' }
        currentPnlPercent:
          allOf: [{ $ref: '#/components/schemas/Decimal' }]
          description: Variacao percentual do preco do tick sobre o entryPrice do lote.
        openedAt:
          type: string
          format: date-time

    PendingOrder:
      type: object
      required: [transactionId, type, quantity, price, status, requestedAt]
      description: >
        Ordem em transito (BUY/SELL). transactionId e o alvo de um SHOULD_CANCEL.
      properties:
        transactionId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TradingAction' }
        quantity: { $ref: '#/components/schemas/Decimal' }
        price: { $ref: '#/components/schemas/Decimal' }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        requestedAt:
          type: string
          format: date-time

    # ---- Decisao (espelha StrategyOutputDto) -------------------------------

    Decision:
      # oneOf + discriminator por `decision`: cada acao exige os seus proprios
      # campos NA FRONTEIRA. Um objeto unico com so os campos comuns obrigatorios
      # deixaria passar SHOULD_BUY sem quantity/confidence ou SHOULD_CANCEL sem
      # targetTransactionId, que so falhariam em runtime no signal path. Aqui o
      # validador/codegen rejeita a decisao malformada antes de virar transacao.
      #
      # `decision` e declarado required NESTE schema (nao so nas variantes) porque
      # a OAS 3.0 exige que a propriedade do discriminator seja required no schema
      # que o declara — sem isso validadores/geradores estritos podem des-
      # polimorfizar o modelo e perder as checagens por acao.
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/TradingAction' }
      oneOf:
        - $ref: '#/components/schemas/HoldDecision'
        - $ref: '#/components/schemas/BuyDecision'
        - $ref: '#/components/schemas/SellDecision'
        - $ref: '#/components/schemas/CancelDecision'
      discriminator:
        propertyName: decision
        mapping:
          SHOULD_HOLD: '#/components/schemas/HoldDecision'
          SHOULD_BUY: '#/components/schemas/BuyDecision'
          SHOULD_SELL: '#/components/schemas/SellDecision'
          SHOULD_CANCEL: '#/components/schemas/CancelDecision'
      description: >
        Decisao de trade. O campo `decision` seleciona a variante (discriminator)
        e cada variante torna obrigatorios os campos daquela acao. Regras de
        coerencia por decision:
          SHOULD_HOLD   : quantity/confidence ignorados; nenhuma acao.
          SHOULD_BUY    : quantity (> 0) e confidence ([0,1]) obrigatorios.
          SHOULD_SELL   : quantity (> 0) e confidence ([0,1]) obrigatorios; targetLotId opcional (null=FIFO).
          SHOULD_CANCEL : targetTransactionId obrigatorio; quantity/confidence ignorados.

    DecisionBase:
      # Campos comuns a toda decisao. `decision` e declarado em cada variante com
      # o enum restrito a uma unica acao (exigencia do discriminator).
      type: object
      required: [strategyName, reasoning]
      properties:
        strategyName:
          type: string
          description: Nome logico da estrategia (ecoado em logs/observabilidade).
        reasoning:
          type: string
          description: Justificativa legivel da decisao (auditoria/observabilidade).
        timestamp:
          type: string
          format: date-time
          nullable: true
          description: Instante da decisao, ISO-8601 UTC. Preenchido pela app.
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: Extensao livre (indicadores, features, diagnostico).

    HoldDecision:
      description: HOLD — nenhuma acao neste tick; quantity/confidence ignorados.
      allOf:
        - $ref: '#/components/schemas/DecisionBase'
        - type: object
          required: [decision]
          properties:
            decision:
              type: string
              enum: [SHOULD_HOLD]

    BuyDecision:
      description: BUY — quantity (> 0) e confidence ([0,1]) obrigatorios.
      allOf:
        - $ref: '#/components/schemas/DecisionBase'
        - type: object
          required: [decision, quantity, confidence]
          properties:
            decision:
              type: string
              enum: [SHOULD_BUY]
            quantity:
              allOf: [{ $ref: '#/components/schemas/PositiveDecimal' }]
              description: Quantidade absoluta a executar (> 0).
            confidence:
              allOf: [{ $ref: '#/components/schemas/UnitFractionDecimal' }]
              description: Grau de conviccao em [0.0, 1.0].
            limitPrice:
              allOf: [{ $ref: '#/components/schemas/NullablePositiveDecimal' }]
              description: >
                Preco-limite da ordem. null = usar o preco de mercado do tick
                (default). Se informado, deve ser positivo.

    SellDecision:
      description: SELL — quantity (> 0) e confidence ([0,1]) obrigatorios; targetLotId opcional.
      allOf:
        - $ref: '#/components/schemas/DecisionBase'
        - type: object
          required: [decision, quantity, confidence]
          properties:
            decision:
              type: string
              enum: [SHOULD_SELL]
            quantity:
              allOf: [{ $ref: '#/components/schemas/PositiveDecimal' }]
              description: Quantidade absoluta a executar (> 0).
            confidence:
              allOf: [{ $ref: '#/components/schemas/UnitFractionDecimal' }]
              description: Grau de conviccao em [0.0, 1.0].
            limitPrice:
              allOf: [{ $ref: '#/components/schemas/NullablePositiveDecimal' }]
              description: >
                Preco-limite da ordem. null = usar o preco de mercado do tick
                (default). Se informado, deve ser positivo.
            targetLotId:
              type: string
              format: uuid
              nullable: true
              description: SELL de lote especifico. null = FIFO.

    CancelDecision:
      description: CANCEL — targetTransactionId obrigatorio; quantity/confidence ignorados.
      allOf:
        - $ref: '#/components/schemas/DecisionBase'
        - type: object
          required: [decision, targetTransactionId]
          properties:
            decision:
              type: string
              enum: [SHOULD_CANCEL]
            targetTransactionId:
              type: string
              format: uuid
              description: Ordem em transito a cancelar.

    # ---- Operacional --------------------------------------------------------

    Health:
      # Readiness AGREGADA da app (GET /health). Sem strategyRef: `ready` fala
      # pela app inteira (todas as versoes prontas), nunca por uma versao — por
      # isso o eco nao existe aqui. Prova por-versao vem de ScopedHealth.
      type: object
      required: [status, ready]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        ready:
          type: boolean
          description: >
            Agregado: true somente quando TODAS as versoes servidas terminaram o
            warm-up e a app pode ir para ACTIVE. Readiness por versao: ScopedHealth.
        detail:
          type: string
          nullable: true
          description: 'Ex.: "warming up 12/20 ticks".'

    ScopedHealth:
      # Readiness de UMA versao (GET /health/{strategyRef}). strategyRef e
      # OBRIGATORIO e nao-nulo: e a prova, no schema, de que `ready` pertence a
      # versao consultada. Sem isso uma resposta agregada se passaria por
      # escopada e o portao de promocao poderia promover uma versao fria.
      allOf:
        - $ref: '#/components/schemas/Health'
        - type: object
          required: [strategyRef]
          properties:
            strategyRef:
              type: string
              format: uuid
              description: >
                Versao a que `ready` se refere (eco do path). Obrigatorio e
                nao-nulo; aqui `ready` e escopado a esta versao, nao agregado.
            runnerId:
              type: string
              format: uuid
              nullable: true
              description: >
                Eco do query param runnerId quando informado: `ready` fala pelo
                warm-up deste runner nesta versao.

    Meta:
      type: object
      required: [strategyId, name, version, contractVersion]
      properties:
        strategyId:
          type: string
          format: uuid
          description: Identidade imutavel desta versao de estrategia.
        name:
          type: string
        version:
          type: string
          description: Versao semantica da estrategia, ex. "2.0.0".
        contractVersion:
          type: string
          description: Versao do contrato implementada, ex. "1.0.0".

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        details:
          type: object
          additionalProperties: true
          nullable: true
