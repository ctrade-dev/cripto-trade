spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
      write-bigdecimal-as-plain: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ctrade}
    username: ${DB_USERNAME:ctrade}
    password: ${DB_PASSWORD:ctrade123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    # T66: DEBUG por padrao. TRACE (acesso ao banco a cada ciclo) era ~75% do volume e girava o log do
    # container em ~1h30; quando precisar, LOGGING_LEVEL_COM_MARMITT=TRACE.
    com.marmitt: DEBUG
    org.springframework: INFO
    org.apache: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

binance:
  ws-base-url: wss://stream.binance.com:9443
  rest-base-url: https://api.binance.com
  ws-api-base-url: wss://ws-api.binance.com:443/ws-api/v3
  api-key: ${BINANCE_API_KEY:}
  api-secret: ${BINANCE_API_SECRET:}

event:
  retry:
    max-attempts: 5
    initial-interval-ms: 1000
    max-interval-ms: 30000
    multiplier: 2.0

margin:
  release:
    max-attempts: 2147483647
    initial-interval-ms: 1000
    max-interval-ms: 60000
    multiplier: 2.0


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # T51: mostra o nivel do Safe Mode por portfolio (componente safeMode).
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        boot.phase.duration: true
        http.server.requests: true
        jvm.gc.pause: true

runner:
  boot:
    orchestrator-enabled: true
    phase1:
      enabled: true
    phase2:
      enabled: true
      mode: WARN_ONLY
      account-query-policy: SKIP
      portfolio:
        sanity-check:
          enabled: true
          threshold: 0.00000001
        cutoff:
          enabled: true
        zombie-detection:
          enabled: true
    phase3:
      enabled: true
      pending-grace-ms: 600000   # PENDING mais novo que isto e deferido (nao expirado) no boot
      exchange-query-timeout-ms: 10000
      exchange-query-max-attempts: 3
      exchange-query-initial-backoff-ms: 300
      exchange-query-backoff-multiplier: 2.0
      exchange-query-max-backoff-ms: 5000
  recovery:
    transaction:
      enabled: true
      interval-ms: 60000
      stale-threshold-ms: 30000
      pending-grace-ms: 600000   # carencia maior p/ PENDING (reserva orfa) — > dispatch+ACK
      max-per-run: 50
  lifecycle:
    termination-check-interval-ms: 10000
  signal:
    threads: 4                       # T42: threads que avaliam runners (1 por runner por vez)
    stale-tick-threshold-ms: 5000    # tick mais velho que isto ao iniciar a avaliacao e descartado
    slow-processing-warn-ms: 1000    # avaliacao mais longa gera WARN (nao aborta)   # T49: arquiva runners TERMINATING sem posicao nem ordem em voo

exchange:
  order-query:
    circuit-breaker:
      # T24: consultas REST de ordens (boot recovery, watchdog). Abre com 5 falhas de instabilidade
      # (rede, 5xx, rate limit) e testa de novo apos 60s; erro de requisicao/autenticacao nao conta.
      enabled: true
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state-ms: 60000
      permitted-number-of-calls-in-half-open-state: 3

safe-mode:
  auto:
    # T25: gatilhos automaticos (decisao de 2026-10-19). Portfolio: HALT, retomada sempre manual.
    # Runner: halt so do runner, retomada manual pelo resume. enabled=false desliga todos (o drawdown
    # da T43 tem chave propria em portfolio.circuit-breaker).
    enabled: true
    evaluation-interval-ms: 30000
    dlq:
      enabled: true
      threshold: 3
    balance-divergence:
      enabled: true
      # T57: conferencia de saldo por exchange durante a operacao; HALT na 2a leitura seguida em DEFICIT.
      evaluation-interval-ms: 300000
    watchdog:
      enabled: true
      max-stuck-cycles: 3
    rejections:
      enabled: true
      max-consecutive: 5

portfolio:
  circuit-breaker:
    # T43: HALT automatico quando o equity (available + reserved + PnL flutuante) cai mais que
    # max-drawdown-percent em relacao ao pico das ultimas 24h (ou desde o ultimo reset manual).
    enabled: true
    max-drawdown-percent: 0.10
    check-interval-ms: 10000

admin:
  api:
    key: ${ADMIN_API_KEY:}

notification:
  discord:
    # Vazio ⇒ notificações Discord desativadas (adapter no-op); a aplicação sobe normalmente.
    webhook-url: ${DISCORD_WEBHOOK_URL:}
  grafana:
    # Opcional: template do link "ver logs" no Discord; {correlationId} é substituído em runtime.
    explore-url-template: ${GRAFANA_EXPLORE_URL_TEMPLATE:}

ctrade:
  observability:
    # T51: amostra de Safe Mode, utilizacao de capital e lifecycle para o Prometheus.
    enabled: true
    report-interval-ms: 15000
    termination-timeout-ms: 600000
    # T55: limiares do estado consolidado (GET /api/admin/operational-state).
    market-data-stale-ms: 60000          # sem tick com runner ACTIVE: CRITICAL (T56: tambem reassina)
    reservation-stale-ms: 86400000       # BUY em voo segurando capital: WARN
  market-data:
    auto-feed:
      # T56: abre conexoes e assinaturas que os runners operacionais precisam (boot, ciclo, start/resume).
      enabled: ${CTRADE_MARKET_DATA_AUTO_FEED_ENABLED:true}
      interval-ms: 30000
      default-stream-type: TICKER
      stream-types: {}                   # por exchange, ex.: BINANCE: TICKER
  strategy:
    remote:
      # T41: estrategias fora do processo (docs/strategy-service/CONTRACT.md).
      # T54: o catalogo e o token de cada estrategia ficam no banco, administrados por /api/admin/strategies.
      timeout-ms: 250                    # timeout rigido da chamada /evaluate (sem retry)
      max-decision-age-ms: 2000          # decisao mais velha que isto (desde o tick) vira HOLD
      registration-retry-interval-ms: 30000  # ciclo que alinha o catalogo e repete conferencias pendentes
