apiVersion: 1

# Alert rules comportamentais sobre os logs no Loki (T21 — Camadas 2 e 3).
# Todas roteiam para o Discord via label channel=alerts-behavior.
groups:
  - orgId: 1
    name: ctrade-behavior
    folder: ctrade-alerts
    interval: 1m
    rules:
      # --- Camada 2: anomalias por taxa ---
      - uid: ctrade-warn-rate-high
        title: Alta taxa de WARN
        condition: C
        for: 2m
        labels:
          channel: alerts-behavior
          severity: warning
        annotations:
          summary: 'Taxa de logs WARN elevada nos últimos 5 min'
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({app="ctrade", level="WARN"} [5m]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [150] }
              refId: C

      - uid: ctrade-error-spike
        title: Spike de ERROR
        condition: C
        for: 0m
        labels:
          channel: alerts-behavior
          severity: critical
        annotations:
          summary: 'Spike de logs ERROR no último minuto'
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({app="ctrade", level="ERROR"} [1m]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [6] }
              refId: C

      - uid: ctrade-reconnect-frequent
        title: Reconexões frequentes
        condition: C
        for: 1m
        labels:
          channel: alerts-behavior
          severity: warning
        annotations:
          summary: 'Frequência de reconexão acima do esperado (> 3/min em 5 min)'
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({app="ctrade"} |= `reconnect` [5m]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [15] }
              refId: C

      # --- Camada 3: ausência de sinais de fluxo (logs sentinel) ---
      - uid: ctrade-no-fills-confirmed
        title: Nenhum fill confirmado
        condition: C
        for: 0m
        labels:
          channel: alerts-behavior
          severity: warning
        annotations:
          summary: 'Nenhum executionConfirmedReaction final nos últimos 10 min'
        noDataState: Alerting
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({app="ctrade"} |= `executionConfirmedReaction:` |~ `isFinal=true` [10m]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: ctrade-no-orders-submitted
        title: Nenhuma ordem submetida
        condition: C
        for: 0m
        labels:
          channel: alerts-behavior
          severity: warning
        annotations:
          summary: 'Nenhuma transição PENDING->SUBMITTED nos últimos 30 min'
        noDataState: Alerting
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({app="ctrade"} |= `PENDING->SUBMITTED` [30m]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      - uid: ctrade-boot-recovery-errors
        title: Boot recovery com erros
        condition: C
        for: 0m
        labels:
          channel: alerts-behavior
          severity: critical
        annotations:
          summary: 'bootRecovery: completed com hasErrors=true'
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              expr: 'sum(count_over_time({app="ctrade"} |= `bootRecovery: completed` |~ `hasErrors=true` [10m]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

  # Estado operacional sobre as metricas do Prometheus (T51; IG 7.7, 11.7, 13.7).
  - orgId: 1
    name: ctrade-operational
    folder: ctrade-alerts
    interval: 1m
    rules:
      - uid: ctrade-safe-mode-active
        title: Safe Mode ativo
        condition: C
        for: 0m
        labels:
          channel: alerts-behavior
          severity: critical
        annotations:
          summary: 'Algum portfolio fora de NORMAL (circuit_breaker_current_level > 0)'
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max(circuit_breaker_current_level)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: ctrade-runner-termination-stuck
        title: Runner travado em TERMINATING
        condition: C
        for: 0m
        labels:
          channel: alerts-behavior
          severity: warning
        annotations:
          summary: 'Runner em TERMINATING ha mais que o timeout (10 min)'
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max(runner_lifecycle_termination_stuck)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: ctrade-cancel-rate-high
        title: Taxa de cancelamento alta
        condition: C
        for: 2m
        labels:
          channel: alerts-behavior
          severity: warning
        annotations:
          summary: 'Runner com mais de 10 SHOULD_CANCEL por minuto (possivel loop ordem/cancelamento)'
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max(increase(signal_evaluated_total{decision="CANCEL"}[1m]))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [10] }
              refId: C

      - uid: ctrade-rejection-rate-high
        title: Taxa de rejeicao alta
        condition: C
        for: 5m
        labels:
          channel: alerts-behavior
          severity: warning
        annotations:
          summary: 'Mais da metade dos sinais de trade de um runner rejeitados em 5 min'
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max(sum by (runnerId) (increase(signal_evaluated_total{decision=~"REJECTED_.*"}[5m])) / sum by (runnerId) (increase(signal_evaluated_total{decision!~"HOLD|SAFE_MODE|STRATEGY_UNAVAILABLE|PROTECTIVE_EXIT"}[5m])))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.5] }
              refId: C

      - uid: ctrade-global-utilization-high
        title: Utilizacao global de capital alta
        condition: C
        for: 5m
        labels:
          channel: alerts-behavior
          severity: warning
        annotations:
          summary: 'Reservado acima de 80% do capital do portfolio'
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max(capital_utilization_global)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }
              refId: C

      - uid: ctrade-exchange-circuit-open
        title: Circuit breaker da exchange aberto
        condition: C
        for: 0m
        labels:
          channel: alerts-behavior
          severity: warning
        annotations:
          summary: 'Consultas REST de ordens a exchange em falha: circuito aberto (T24)'
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'max(resilience4j_circuitbreaker_state{state="open"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      - uid: ctrade-log-ingestion-gap
        title: Logs do ctrade não chegam ao Loki
        condition: C
        for: 5m
        labels:
          channel: alerts-behavior
          severity: critical
        annotations:
          summary: 'O ctrade registrou logs nos últimos 10 min que o Loki não recebeu (T66): os alertas por log estão cegos'
        # Sem dado do Prometheus (ctrade fora do ar) não é buraco de log; Loki fora do ar (erro na consulta) é.
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              datasource: { type: loki, uid: loki }
              # "or vector(0)": Loki sem linha devolve 0, não "sem dado"
              expr: 'sum(count_over_time({app="ctrade"} [10m])) or vector(0)'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'sum(increase(logback_events_total[10m]))'
              instant: true
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: math
              expression: '$B > 200 && $A < $B / 2'
              refId: C
